services:
  mongodb:
    image: mongo:6.0
    container_name: shinttools-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: shinttools
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: mongosh --eval 'db.adminCommand("ping")'
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  core:
    build:
      context: core/
      dockerfile: Dockerfile
    container_name: shinttools-core
    ports:
      - "18200:18200"
    environment:
      MONGO_URL: "mongodb://mongodb:27017/shinttools"
      # LLM agent — modelo Qwen2.5-Coder 1.5B (GitHub Releases, sin telemetría)
      # Al actualizar el modelo: cambiar FILE, URL y SHA256 juntos.
      SHINTTOOLS_MODELS_DIR: "/app/core/models"
      SHINTTOOLS_MODEL_FILE: "Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf"
      SHINTTOOLS_MODEL_URL: "https://github.com/Noctxas97Dev/ShintTools-Models/releases/download/v2.0-models/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf"
      SHINTTOOLS_MODEL_SHA256: "f530705d447660a4336c329981af164b471b60b974b1d808d57e8ec9fe23b239"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:18200/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Mount models from host so GGUF persists across container restarts
      - ./models:/app/core/models
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
