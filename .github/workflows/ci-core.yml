name: CI Core

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # See ci-lint.yml: push-triggered runs stopped being created for this repo
  # on 2026-08-06, so a manual trigger is the only way to run CI on demand.
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r core/requirements-ci.txt
      - name: Run pytest
        # The suite exercises the PAID surface (dashboard, LOD audit) —
        # without the edition flag the app imports as free, the paid routers
        # never mount, and 24 tests 404. The paid container passes the same
        # suite; CI must match that environment.
        env:
          SHINT_CORE_EDITION: paid
        run: pytest core/tests/