name: CI Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r core/requirements-ci.txt
      - name: Install lint tools
        run: pip install flake8 mypy
      - name: Run flake8
        run: flake8 core/ --max-line-length=88 --extend-ignore=E203,W503
      - name: Run mypy
        run: mypy core/ --ignore-missing-imports --explicit-package-bases
