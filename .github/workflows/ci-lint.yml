name: CI Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual runs. Added because push-triggered runs stopped being created for
  # this repo on 2026-08-06 (GitHub receives the PushEvent — it is in the
  # repo's event feed — but no run appears), which left no way to verify a
  # lint fix at all. Worth keeping regardless: re-running lint on a branch
  # without an empty commit is useful on its own.
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r core/requirements-ci.txt
      - name: Install lint tools
        # types-PyYAML is not optional polish: without it mypy reports
        # `Library stubs not installed for "yaml"` and fails the job.
        # --ignore-missing-imports does NOT cover this — that flag is for
        # packages mypy cannot find at all, and PyYAML IS installed (it comes
        # in via requirements-ci.txt); it simply ships no type information.
        run: pip install flake8 mypy types-PyYAML
      - name: Run flake8
        run: flake8 core/ --max-line-length=88 --extend-ignore=E203,W503
      - name: Run mypy
        run: mypy core/ --ignore-missing-imports --explicit-package-bases
