# Publish the Core Engine Docker image to GitHub Container Registry.
#
# Triggered on:
#   * Tag push matching v*.*.* (production release)
#   * workflow_dispatch (manual smoke runs from the Actions tab)
#
# Output (two editions, same Dockerfile, selected by SHINT_CORE_EDITION):
#   FREE  (Fab / free tier — paid sources physically stripped):
#     ghcr.io/shinttools/shinttools-core:<semver tag>   (immutable)
#     ghcr.io/shinttools/shinttools-core:latest         (mutable, last build)
#   PAID  (Indie + Studio — LLM agent + LOD Auditor + dashboard):
#     ghcr.io/shinttools/shinttools-core:<semver tag>-paid
#     ghcr.io/shinttools/shinttools-core:paid           (mutable, last build)
#
# The marketplace/free plugin pulls :latest; the paid launcher pipeline pulls
# :paid. The free image cannot be unlocked at runtime — the paid modules are
# absent, not merely unrouted.
#
# The image is PUBLIC and pulled anonymously by the ShintTools marketplace
# plugin (UE5 Fab + Unity AS) on first install via FShintCoreInstaller.
# ghcr.io public images have no per-puller rate limit -- this scales to
# hundreds / thousands of users without falling into Docker Hub's
# 100-pulls-per-6h-per-IP throttle.
#
# Why not Docker Hub: Docker Hub free tier throttles anonymous pulls per
# IP, which breaks customers behind shared NAT (corporate / school).
# Paid Docker Hub Pro fixes our side but does NOT lift the puller IP
# limit. ghcr.io lifts both.
#
# Why not push from Raúl's laptop: that ties the supply chain to one
# developer's environment and credentials. Actions uses the repo's
# automatic GITHUB_TOKEN (scoped to packages:write) and runs from a
# clean Ubuntu image -- reproducible and audit-logged.

name: Publish Core image to ghcr.io

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Concurrency: cancel in-flight publishes if a newer tag lands while one
# is still building. We never want two builds racing to push the same
# :latest tag.
concurrency:
  group: publish-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & push core image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name must be lowercased (ghcr.io requirement). We pin
      # to the repo owner's namespace so the image is co-located with
      # the source repo's Packages tab -- no extra org admin needed.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shinttools/shinttools-core
          # Semver tag (v1.2.3 -> 1.2.3) for immutable refs + latest for
          # the mutable convenience tag the marketplace plugin pulls.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Always update :latest — this workflow only triggers on version
            # tags and manual dispatch, so latest tracking the newest build is
            # the intended behavior (and lets a manual dispatch publish :latest
            # for verification without cutting a release tag).
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ShintTools Core
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Proprietary

      - name: Build & push (FREE edition)
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          # Free is the Dockerfile default (SHINT_CORE_EDITION=free) — the
          # paid sources are stripped during this build.
          build-args: |
            SHINT_CORE_EDITION=free
          # amd64 only for now -- UE5/Unity editors on macOS arm64 will
          # use Rosetta or skip Docker via the native fallback that
          # the marketplace plugin's installer falls back to.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache reduces rebuild time from ~6 min to
          # ~90 s when the Dockerfile layers haven't changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── PAID edition ────────────────────────────────────────────────────────
      # MIGRATION (see docs/REGISTRY_PULL_TOKEN_CONTRACT.md): the paid edition is
      # moving OUT of the public `shinttools-core` package into its own PRIVATE
      # package `shinttools-core-paid`, pulled with a dashboard-minted token.
      # GHCR visibility is per-package, so a public `:latest` and a private
      # `:paid` cannot coexist in one package — hence a second package.
      #
      # The cutover is gated on the repo variable PAID_PRIVATE_ENABLED so that
      # committing this workflow changes NOTHING in production until (1) the
      # dashboard token endpoint is live and (2) the launcher/plugin token-login
      # releases have shipped. Flip the variable to 'true' to cut over.
      #
      #   PAID_PRIVATE_ENABLED != 'true' (default) → legacy: paid stays in the
      #     public `shinttools-core` package with -paid tags (current behavior).
      #   PAID_PRIVATE_ENABLED == 'true'           → paid goes to the private
      #     `shinttools-core-paid` package; the public package is free-only.

      # Legacy (default): paid in the public package, -paid suffixed.
      - name: Derive PAID image metadata (legacy public)
        id: meta_paid_public
        if: vars.PAID_PRIVATE_ENABLED != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shinttools/shinttools-core
          flavor: |
            latest=false
            suffix=-paid
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=paid,suffix=
          labels: |
            org.opencontainers.image.title=ShintTools Core (paid)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Proprietary

      - name: Build & push (PAID edition, legacy public)
        if: vars.PAID_PRIVATE_ENABLED != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          build-args: |
            SHINT_CORE_EDITION=paid
          platforms: linux/amd64
          tags: ${{ steps.meta_paid_public.outputs.tags }}
          labels: ${{ steps.meta_paid_public.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Target state: paid in its OWN private package. Convenience tag is
      # :latest WITHIN this private package (the old :paid tag has no meaning
      # once free and paid no longer share a package).
      - name: Derive PAID image metadata (private package)
        id: meta_paid_private
        if: vars.PAID_PRIVATE_ENABLED == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shinttools/shinttools-core-paid
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ShintTools Core (paid)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Proprietary

      - name: Build & push (PAID edition, private package)
        if: vars.PAID_PRIVATE_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          build-args: |
            SHINT_CORE_EDITION=paid
          platforms: linux/amd64
          tags: ${{ steps.meta_paid_private.outputs.tags }}
          labels: ${{ steps.meta_paid_private.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The FREE package must be public (anonymous Fab pulls). Idempotent --
      # subsequent runs noop. Without this the first published version lands
      # PRIVATE and anonymous pulls fail.
      - name: Mark free package public
        if: github.event_name != 'pull_request'
        run: |
          gh api -X PATCH \
            "/orgs/ShintTools/packages/container/shinttools-core/visibility" \
            -f visibility=public \
            || echo "Package may already be public, continuing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The PAID package must stay PRIVATE. First publish already lands private;
      # this asserts it explicitly so it can never drift public. Only runs once
      # the migration is enabled (the private package exists).
      - name: Assert paid package private
        if: ${{ github.event_name != 'pull_request' && vars.PAID_PRIVATE_ENABLED == 'true' }}
        run: |
          gh api -X PATCH \
            "/orgs/ShintTools/packages/container/shinttools-core-paid/visibility" \
            -f visibility=private \
            || echo "Paid package visibility patch skipped (may not exist yet)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
