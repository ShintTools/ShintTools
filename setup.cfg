[flake8]
max-line-length = 88
extend-ignore = W503
# Excluded paths (besides the obvious __pycache__ / .git / venv):
#   * core/benchmark_*.py       - ad-hoc perf scripts, dev workbench
#   * core/examples_*.py        - demo scripts shown in docs
#   * core/scripts/_smoke_*.py  - one-off smoke / demo scripts
#   * core/scripts/demo_*.py    - one-off demo scripts
#   * core/_*.py                - root-level debug scripts (_dbg_, _add_, _test_)
# These are throwaway exploration files that should not gate the CI.
# Anything in core/api/, core/modules/, or core/tests/ stays lintable.
exclude =
    __pycache__,
    .git,
    *.pyc,
    venv,
    .venv,
    core/benchmark_*.py,
    core/examples_*.py,
    core/scripts/_smoke_*.py,
    core/scripts/demo_*.py,
    core/_*.py
