# Mobile (mid-tier Android/iOS reference), 30 fps target. Uncalibrated — see
# platform_console_30.yaml for the confidence-capping note. hw_scale_factor
# is intentionally aggressive: mobile SoCs pay a much larger tax per tick/
# allocation than desktop, matching the existing lod_auditor "mobile" profile
# philosophy (config/thresholds_mobile.yaml in lod_auditor).
profile: mobile_30
