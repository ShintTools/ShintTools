target_fps: 30
frame_budget_ms: 33.3
cpu_budget_ms: 18.0
gpu_budget_ms: 22.0
vram_budget_mb: 2048
ram_budget_mb: 3072
disk_read_mb_s: 350
build_advisory_mb: 4096
reference_hw: "Uncalibrated — scaled from desktop_60 baseline"
hw_scale_factor: 3.5
